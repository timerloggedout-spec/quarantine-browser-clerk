name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: qbc-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t qbc-sandbox:ci .
      - run: docker run --rm qbc-sandbox:ci python -m pytest -p no:cacheprovider tests/ -q
